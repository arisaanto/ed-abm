name: Python checks

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CPU requirements
        run: python -m pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m py_compile config.py main.py src/*.py scripts/*/*.py tests/*.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check Snellius job syntax
        run: find jobs -maxdepth 1 -name '*.sbatch' -print -exec bash -n {} \;
