name: Publish persona explorer

on:
  push:
    branches:
      - main
    paths:
      - "web/persona-explorer/**"
      - ".github/workflows/persona-explorer-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: persona-explorer-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload persona explorer
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/persona-explorer

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
